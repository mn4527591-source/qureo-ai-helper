
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUREO AI | مساعد كيريو</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1220;color:#fff;font-family:Arial,sans-serif}
header{padding:22px;background:#121e32;border-bottom:1px solid #263750}
.logo{font-size:25px;font-weight:bold;color:#60a5fa}
main{max-width:750px;margin:30px auto;padding:15px}
.hero,.card{background:#142239;border:1px solid #293d59;border-radius:18px;padding:22px;margin-bottom:18px}
h1{font-size:27px}
p{color:#b6c6dc;line-height:1.8}
label{display:block;margin:17px 0 9px;font-weight:bold}
textarea{width:100%;height:130px;background:#091321;color:white;border:1px solid #405575;border-radius:12px;padding:13px;font-size:15px;resize:vertical}
button{background:#2563eb;color:white;border:0;padding:14px;border-radius:12px;font-size:16px;font-weight:bold;width:100%;margin-top:14px}
button:active{opacity:.8}
.result{background:#091321;padding:15px;border-radius:12px;white-space:pre-wrap;line-height:1.8;min-height:80px}
.tag{display:inline-block;background:#203a5b;color:#9dccff;padding:7px 12px;border-radius:20px;margin:4px}
footer{text-align:center;color:#8294ac;padding:20px;font-size:13px}
</style>
</head>
<body>
<header>
<div class="logo">QUREO AI 🤖</div>
<p>مساعدك الذكي لتعلم البرمجة</p>
</header>
<main>
<section class="hero">
<h1>أهلاً بك في مساعد كيريو</h1>
<p>افهم أسئلة JavaScript وتعلم كتابة الأكواد وتصحيح الأخطاء خطوة بخطوة.</p>
<span class="tag">JavaScript</span>
<span class="tag">شرح عربي</span>
<span class="tag">مساعد برمجة</span>
</section>

<section class="card">
<h2>مساعد البرمجة</h2>
<label>اكتب سؤال التمرين</label>
<textarea id="question" placeholder="اكتب سؤال كيريو هنا..."></textarea>

<label>اكتب محاولتك البرمجية</label>
<textarea id="code" placeholder="اكتب كود JavaScript هنا..."></textarea>

<button onclick="help()">حلل السؤال</button>
</section>

<section class="card">
<h2>الشرح والنتيجة</h2>
<div class="result" id="result">ستظهر المساعدة هنا...</div>
<button onclick="copyResult()">نسخ الشرح</button>
</section>
</main>
<footer>QUREO AI Helper © 2026</footer>

<script>
function help(){
const q=document.getElementById('question').value.trim();
const c=document.getElementById('code').value.trim();
const r=document.getElementById('result');

if(!q){
r.textContent='من فضلك اكتب سؤال التمرين أولاً.';
return;
}

let answer='سؤال التمرين:\n'+q+'\n\n';

if(c){
answer+='محاولتك:\n'+c+'\n\n';
answer+='تم استلام الكود. راجع الأقواس والفواصل وأسماء المتغيرات وتأكد من مطابقة الكود للمطلوب.\n\n';
}else{
answer+='لم تكتب محاولة برمجية بعد.\n\n';
}

answer+='لفهم السؤال:\n1- حدد المطلوب.\n2- حدد المدخلات والمخرجات.\n3- اختر الأوامر المناسبة في JavaScript.\n4- جرّب الحل وتحقق من النتيجة.\n\n';
answer+='ملاحظة: هذه نسخة أولية لا تتصل بمحرك ذكاء اصطناعي بعد.';

r.textContent=answer;
}

function copyResult(){
const text=document.getElementById('result').textContent;
if(navigator.clipboard){
navigator.clipboard.writeText(text).then(()=>alert('تم النسخ'));
}else{
alert('حدد النص وانسخه يدوياً');
}
}
</script>
</body>
</html>
